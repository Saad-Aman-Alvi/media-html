<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Simple Responsive Page</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f8f9fa;
      line-height: 1.6;
    }

    header {
      background-color: #007bff;
      color: white;
      padding: 15px 30px;
    }

    nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      max-width: 1100px;
      margin: 0 auto;
    }

    nav h1 {
      font-size: 1.5rem;
    }

    nav ul {
      list-style: none;
      display: flex;
      gap: 20px;
    }

    nav ul li a {
      color: white;
      text-decoration: none;
      font-weight: bold;
    }

    .hero {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 50px 20px;
      text-align: center;
    }

    .hero img {
      max-width: 100%;
      height: auto;
      border-radius: 10px;
      margin-top: 20px;
    }

    .hero h2 {
      font-size: 2rem;
      margin-bottom: 10px;
      color: #333;
    }

    .hero p {
      color: #555;
      max-width: 600px;
    }

    @media (min-width: 768px) {
      .hero {
        flex-direction: row;
        text-align: left;
        gap: 40px;
        padding: 80px 40px;
      }

      .hero-text, .hero img {
        flex: 1;
      }
    }
   h1{
    display: flex;
    text-align: center;
   }
  </style>
</head>
<body>

  <header>
    <nav>
      <h1>MyWebsite</h1>
      <ul>
        <li><a href="#">Home</a></li>
        <li><a href="#">About</a></li>
        <li><a href="#">Contact</a></li>
      </ul>
    </nav>
  </header>

  <section class="hero">
    <div class="hero-text">
      <h2>Welcome to My Simple Page</h2>
      <p>This page is built using just HTML and CSS. It features a responsive layout, navigation bar, and clean design.</p>
    </div>
    <img src="https://via.placeholder.com/400x250" alt="Sample Image">
  </section>

</body>
</html>
