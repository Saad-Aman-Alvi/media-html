<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>navigation bar</title>
    <style>
        .navbar {
            background-color: rgb(0, 0, 0);
            border-radius: 25px;
            margin: 3px auto;
        }
        .navbar ul {
            overflow: auto;
        }
        .navbar ul li {
            float: left;
            list-style: none;
            padding: 14px 15px;
            margin: 12px 13px;
        }
        .navbar ul li a {
            text-decoration: none;
            color: antiquewhite;
            font-size: larger;
        }
        .navbar ul li a:hover {
            color: red;
        }
        .searchbar {
            float: right;
            margin: 27px 40px;
        }
    </style>
</head>
<body>
    <header>
        <nav class="navbar">
            <ul>
                <li><a href="">Home</a></li>
                <li><a href="">Details</a></li>
                <li><a href="">Support
                    </a></li>
                <li><a href="">About</a></li>
                <div class="searchbar">
                    <input type="text" name="name" id="search" placeholder="search the web">
                </div>
            </ul>
        </nav>
    </header>
</body>
</html>
