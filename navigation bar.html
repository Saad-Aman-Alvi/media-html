<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navigation bar css</title>
    <style>
.navbar {
background-color: black;
border-radius: 16px;

}
.navbar ul{
    overflow: auto;
}
    .navbar li{
        float: left;
list-style: none;
margin: 13px 20px;

    }
.navbar li a{
    padding: 3px 3px;
    text-decoration: none;
    color: aliceblue;
 }
 .search{
    color: aliceblue;
    float: right;
    padding: 12px 75px;
  
 }
.navbar input {
border: 2px solid black;
    border-radius: 14px;
    padding: 4px;
}
.navbar li a:hover{
color: red;
}
    


    </style>
</head>
<body>
<header>
<nav class="navbar">
<ul>
<li><a href="">home</a></li>
<li><a href="">support</a></li>
<li><a href="">help</a></li>
<li><a href="">about</a></li>

<div class="search">
    <input type="text" name="name" id="search" placeholder="search the web">
</div>
</ul>

</nav>




</header>    
</body>
</html>
